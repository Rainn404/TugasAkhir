<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <!-- Background transparent -->
  <rect width="500" height="120" fill="none"/>
  
  <!-- Tent Canopy Icon (Monochrome) -->
  <g transform="translate(15, 10)">
    <!-- Main Tent Roof -->
    <path d="M 50 15 L 90 65 L 10 65 Z" fill="#111111" />
    <path d="M 50 15 L 50 65" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" />
    <!-- Side Drapes / Curtains -->
    <path d="M 10 65 Q 25 75 10 95 L 20 95 Q 35 75 25 65 Z" fill="#111111" />
    <path d="M 90 65 Q 75 75 90 95 L 80 95 Q 65 75 75 65 Z" fill="#111111" />
    <!-- Center Peak Emblem / Diamond Star -->
    <polygon points="50,5 53,13 60,15 53,17 50,25 47,17 40,15 47,13" fill="#111111"/>
    <!-- Support Poles -->
    <line x1="20" y1="65" x2="20" y2="95" stroke="#111111" stroke-width="3"/>
    <line x1="80" y1="65" x2="80" y2="95" stroke="#111111" stroke-width="3"/>
    <line x1="50" y1="65" x2="50" y2="95" stroke="#111111" stroke-width="3"/>
    <!-- Base Platform Line -->
    <line x1="5" y1="95" x2="95" y2="95" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Typography ARSY TENDA -->
  <text x="130" y="62" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="4" fill="#111111">ARSY TENDA</text>
  <text x="132" y="88" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="14" letter-spacing="6" fill="#666666">EVENT EQUIPMENT RENTAL</text>
  <line x1="132" y1="96" x2="480" y2="96" stroke="#111111" stroke-width="2"/>
</svg>
